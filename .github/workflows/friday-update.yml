name: Friday Repertory Auto-Update

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run Auto-Updater
        run: python update_screenings.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "Auto-update weekend showtimes across NYC cinemas" || exit 0
          git push
