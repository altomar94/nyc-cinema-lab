name: Repertory Auto-Update

on:
  schedule:
    # Runs at 11:00 AM UTC (7:00 AM EDT) every Friday, so the "Fri <date>"
    # labels stamped on showtimes match the day the data was scraped.
    - cron: '0 11 * * 5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Dump raw SerpApi responses (debug_serpapi.json artifact)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-screenings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_DEBUG: ${{ inputs.debug }}
        run: |
          python update_screenings.py

      - name: Upload SerpApi Debug Dump
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: serpapi-debug
          path: debug_serpapi.json
          retention-days: 7

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add screenings.json index.html
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto-update weekend repertory screenings [skip ci]"
            git push
          fi
