name: Weekend Repertory Auto-Update

on:
  schedule:
    # Runs at 10:00 AM UTC (6:00 AM EDT) every Wednesday and Friday
    - cron: '0 10 * * 3,5'
  workflow_dispatch: # Allows manual run anytime from the Actions tab

permissions:
  contents: write

jobs:
  update-screenings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests scikit-learn

      - name: Run Update Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python update_screenings.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes detected in index.html."
          else
            git commit -m "Auto-update weekend repertory screenings [skip ci]"
            git push
          fi
