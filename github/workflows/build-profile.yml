name: Build Taste Profile (One-Time / On Demand)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Build Profile JSON
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python build_taste_profile.py

      - name: Commit Profile JSON
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add taste_profile.json
          git commit -m "Update taste_profile.json" || exit 0
          git push
