  <style>
    :root {
      /* Wong Kar-wai Palette: Nocturnal Midnight, HK Neon Red, Cheongsam Amber, Midnight Teal */
      --bg-main: #07080c;
      --bg-topbar: #0c0e17;
      --bg-card: #0f121a;
      --bg-card-hover: #151924;
      --border-subtle: #1c2233;
      --border-strong: #333d59;
      
      --text-primary: #f3ebd7; /* Warm vintage cream */
      --text-secondary: #8b93a6;
      --text-muted: #545c70;
      
      --accent-vermilion: #ff2a4b; /* Electric Neon Red */
      --accent-vermilion-glow: rgba(255, 42, 75, 0.25);
      --accent-gold: #e5a93c; /* Cheongsam Amber */
      --accent-teal: #00e5bc; /* Midnight Clockwork Teal */
      
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 42, 75, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 229, 188, 0.04) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Top Utility Bar */
    .top-bar {
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 32px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(12, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      background-color: var(--accent-vermilion);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-vermilion);
    }

    main {
      max-width: 1320px;
      margin: 40px auto 0;
      padding: 0 32px;
    }

    /* Filter Panel */
    .filter-panel {
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      border-radius: 2px;
      padding: 24px;
      margin-bottom: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-group label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-gold);
    }

    select, input {
      background: var(--bg-topbar);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 11px 14px;
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    select:focus, input:focus {
      border-color: var(--accent-teal);
      box-shadow: 0 0 12px rgba(0, 229, 188, 0.2);
    }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 14px;
      margin-bottom: 32px;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .section-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent-teal);
      letter-spacing: 0.1em;
    }

    /* Exhibition Cards Grid */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 28px;
    }

    .catalog-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      padding: 24px;
      display: flex;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s, background-color 0.3s;
      position: relative;
    }

    .catalog-card:hover {
      border-color: var(--accent-vermilion);
      transform: translateY(-4px);
      background: var(--bg-card-hover);
      box-shadow: 0 14px 40px rgba(255, 42, 75, 0.15);
    }

    .poster-container {
      flex-shrink: 0;
      width: 115px;
      height: 172px;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      background: var(--bg-topbar);
    }

    .poster-container svg, .poster-container img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .card-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .venue-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-teal);
    }

    .badge-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .status-seen {
      background: rgba(139, 147, 166, 0.1);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .match-index {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
    }

    .match-high {
      background: var(--accent-vermilion-glow);
      color: var(--accent-vermilion);
      border: 1px solid rgba(255, 42, 75, 0.5);
      box-shadow: 0 0 10px rgba(255, 42, 75, 0.2);
    }

    .match-mid {
      background: rgba(0, 229, 188, 0.12);
      color: var(--accent-teal);
      border: 1px solid rgba(0, 229, 188, 0.35);
    }

    .film-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      line-height: 1.05;
      color: var(--text-primary);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .film-director {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .format-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 2px 7px;
      border: 1px solid var(--border-strong);
      background: var(--bg-topbar);
      color: var(--text-primary);
      margin-bottom: 12px;
      border-radius: 2px;
    }

    .summary-box {
      font-size: 0.84rem;
      color: var(--text-secondary);
      border-left: 2px solid var(--accent-gold);
      padding-left: 12px;
      margin-bottom: 16px;
      line-height: 1.45;
      font-style: italic;
    }

    .showtimes-container {
      border-top: 1px dashed var(--border-subtle);
      padding-top: 12px;
    }

    .showtimes-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .times-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .time-chip {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      background: var(--bg-topbar);
      border: 1px solid var(--border-subtle);
      padding: 4px 8px;
      border-radius: 2px;
      color: var(--text-primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.2s, background-color 0.2s, color 0.2s;
    }

    .time-chip:hover {
      border-color: var(--accent-teal);
      background: rgba(0, 229, 188, 0.1);
      color: var(--accent-teal);
    }

    @media (max-width: 768px) {
      main { padding: 0 16px; margin-top: 24px; }
      .catalog-grid { grid-template-columns: 1fr; }
      .catalog-card { flex-direction: column; }
      .poster-container { width: 100%; height: 240px; }
    }
  </style>
</head>

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      const seenMode = document.getElementById('seenFilter').value;
      const indexFloor = parseInt(document.getElementById('indexFloorSelect').value);
      const weekend = document.getElementById('weekendSelect').value;
      const theater = document.getElementById('theaterSelect').value;
      const query = document.getElementById('searchInput').value.toLowerCase();

      grid.innerHTML = '';

      const filtered = dataset.filter(item => {
        if (seenMode === 'unseen' && item.seen === true) return false;
        if (item.matchScore < indexFloor) return false;
        if (weekend !== 'all' && item.weekend !== weekend) return false;
        if (theater !== 'all' && item.theater !== theater) return false;
        if (query && !item.title.toLowerCase().includes(query) && !item.director.toLowerCase().includes(query)) return false;
        return true;
      });

      document.getElementById('showingCount').textContent = `${filtered.length} DISCOVERIES CATALOGUED`;

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; padding: 40px 0;">NO UNWATCHED SCREENINGS MATCH THE SPECIFIED CRITERIA.</p>`;
        return;
      }

      filtered.forEach(item => {
        const badgeClass = item.matchScore >= 75 ? 'match-high' : 'match-mid';
        const statusBadge = item.seen 
          ? `<span class="status-badge status-seen">LOGGED IN PROFILE</span>`
          : '';

        const timesHTML = item.showtimes.map(t => {
          const timeText = typeof t === 'object' ? t.time : t;
          const linkUrl = (typeof t === 'object' && t.url) ? t.url : (item.ticketUrl || '#');
          return `<a href="${linkUrl}" target="_blank" rel="noopener noreferrer" class="time-chip">${timeText} ↗</a>`;
        }).join('');

        const posterHTML = item.poster 
          ? `<img src="${item.poster}" alt="${item.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><div style="display:none; width:100%; height:100%;">${item.svg}</div>`
          : item.svg;

        const card = document.createElement('div');
        card.className = 'catalog-card';
        card.innerHTML = `
          <div class="poster-container">
            ${posterHTML}
          </div>
          <div class="card-content">
            <div>
              <div class="card-meta-bar">
                <span class="venue-tag">${item.theater} // ${item.neighborhood}</span>
                <div class="badge-group">
                  ${statusBadge}
                  <span class="match-index ${badgeClass}">${item.matchScore}% INDEX</span>
                </div>
              </div>
              <h3 class="film-title">${item.title}</h3>
              <div class="film-director">${item.director} (${item.year})</div>
              <div><span class="format-badge">${item.format}</span></div>
              <div class="summary-box">${item.summary}</div>
            </div>
            <div class="showtimes-container">
              <div class="showtimes-label">Scheduled Showtimes</div>
              <div class="times-flex">${timesHTML}</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('seenFilter').addEventListener('change', renderCatalog);
    document.getElementById('indexFloorSelect').addEventListener('change', renderCatalog);
    document.getElementById('weekendSelect').addEventListener('change', renderCatalog);
    document.getElementById('theaterSelect').addEventListener('change', renderCatalog);
    document.getElementById('searchInput').addEventListener('input', renderCatalog);

    renderCatalog();
  </script>
