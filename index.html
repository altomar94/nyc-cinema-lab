<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 10 Films This Weekend</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07080a;
      --card-bg: #0e1117;
      --card-border: rgba(243, 235, 215, 0.08);
      --card-border-hover: rgba(243, 235, 215, 0.22);
      --text: #f3ebd7;
      --text-muted: #8b93a6;
      --accent: #e5a93c;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 2.5rem 1.5rem 6rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 2rem;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #fff;
    }

    .meta-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-top: 0.75rem;
    }

    /* Ranked list */
    .top-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .film-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: grid;
      grid-template-columns: 3.5rem 150px 1fr;
      transition: border-color 0.2s ease;
    }

    .film-card:hover {
      border-color: var(--card-border-hover);
    }

    .rank {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 1.4rem;
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 2rem;
      color: var(--text-muted);
    }

    .film-card:first-child .rank {
      color: var(--accent);
    }

    .poster-container {
      width: 150px;
      aspect-ratio: 2 / 3;
      background: #030406;
      overflow: hidden;
    }

    .poster-container img,
    .poster-container svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-width: 0;
    }

    .film-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.7rem;
      line-height: 1.15;
      font-weight: 400;
      color: #fff;
    }

    .film-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .why-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .film-summary {
      font-size: 0.85rem;
      color: #b3bac9;
      line-height: 1.5;
    }

    .venues {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.4rem;
      border-top: 1px dashed var(--card-border);
      padding-top: 0.8rem;
    }

    .venue-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }

    .theater-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text);
    }

    .theater-loc {
      color: var(--text-muted);
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .showtime-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.35rem;
    }

    .showtime-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      background: #090c10;
      padding: 0.3rem 0.5rem;
      border-radius: 3px;
      border: 1px solid rgba(243, 235, 215, 0.04);
    }

    .seen-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      border: 1px solid rgba(243, 235, 215, 0.18);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
      align-self: flex-start;
    }

    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      .film-card {
        grid-template-columns: 2.5rem 110px 1fr;
      }
      .poster-container {
        width: 110px;
      }
      .rank {
        font-size: 1.4rem;
        padding-top: 1.1rem;
      }
      .card-body {
        padding: 1rem;
      }
      .film-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>Top 10 Films</h1>
      <div class="meta-line" id="metaLine"></div>
    </header>

    <main id="list" class="top-list"></main>

    <footer>Ranked for your taste, refreshed every Friday morning.</footer>

  </div>

  <script>
    // -------------------------------------------------------------------------
    // Film data: fetched from screenings.json (regenerated weekly by
    // update_screenings.py), not embedded in this page. The JSON holds unique
    // films ranked 1..N by taste match; this page shows the top 10.
    // -------------------------------------------------------------------------
    const listElem = document.getElementById('list');

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function load() {
      let films = [];
      try {
        const res = await fetch('screenings.json', {cache: 'no-store'});
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const payload = await res.json();
        films = (payload.films || []).slice(0, 10);
        const metaLine = document.getElementById('metaLine');
        if (metaLine) {
          const parts = [];
          if (payload.weekend) parts.push('Weekend of ' + payload.weekend);
          if (payload.generated_at) parts.push('updated ' + payload.generated_at);
          metaLine.textContent = parts.join(' \u00b7 ');
        }
      } catch (e) {
        listElem.innerHTML = '<div class="empty-state">[ SCREENING DATA UNAVAILABLE \u2014 CHECK BACK LATER ]</div>';
        return;
      }

      if (films.length === 0) {
        listElem.innerHTML = '<div class="empty-state">[ NO FILMS FOUND THIS WEEK ]</div>';
        return;
      }

      listElem.innerHTML = films.map(film => {
        const posterMarkup = film.poster
          ? `<img src="${esc(film.poster)}" alt="${esc(film.title)}" loading="lazy" />`
          : (film.svg || '<div style="width:100%;height:100%;background:#111;"></div>');

        const venuesMarkup = (film.venues || []).map(v => {
          const chips = (v.showtimes || []).map(st =>
            `<span class="showtime-chip">${esc(st)}</span>`).join('');
          return `
            <div class="venue">
              <div class="venue-head">
                <span class="theater-name">${esc(v.theater)}</span>
                <span class="theater-loc">${esc(v.neighborhood || '')}</span>
              </div>
              <div class="showtime-chips">${chips}</div>
            </div>`;
        }).join('');

        return `
          <article class="film-card">
            <div class="rank">${film.rank}</div>
            <div class="poster-container">${posterMarkup}</div>
            <div class="card-body">
              <h2 class="film-title">${esc(film.title)}</h2>
              <div class="film-meta">${esc(film.director || 'Unknown')} // ${esc(film.year || '')}</div>
              ${film.why ? `<div class="why-line">${esc(film.why)}</div>` : ''}
              ${film.seen ? `<span class="seen-tag">WATCHED</span>` : ''}
              ${film.summary ? `<p class="film-summary">${esc(film.summary)}</p>` : ''}
              <div class="venues">${venuesMarkup}</div>
            </div>
          </article>`;
      }).join('');
    }

    load();
  </script>
</body>
</html>
