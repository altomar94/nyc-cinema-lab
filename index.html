<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Film Screenings // Repertory & Curated Cinema</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07080a;
      --card-bg: #0e1117;
      --card-border: rgba(243, 235, 215, 0.08);
      --text: #f3ebd7;
      --text-muted: #8b93a6;
      --accent-crimson: #ff2a4b;
      --accent-gold: #e5a93c;
      --accent-teal: #00e5bc;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 2.5rem 1.5rem 6rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header & Stats */
    header {
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 2rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #fff;
    }

    .stats-bar {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
      text-transform: uppercase;
    }

    /* Filters Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
      background: rgba(14, 17, 23, 0.6);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: var(--card-border);
    }

    .filter-btn.active {
      background: #191e28;
      border-color: rgba(243, 235, 215, 0.2);
      color: #fff;
    }

    .search-input {
      background: #090b0e;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius);
      outline: none;
      min-width: 220px;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-teal);
    }

    /* Grid Layout */
    .screenings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    /* Film Card */
    .film-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .film-card:hover {
      transform: translateY(-3px);
      border-color: rgba(243, 235, 215, 0.25);
    }

    .poster-container {
      width: 100%;
      aspect-ratio: 2 / 3;
      position: relative;
      background: #030406;
      overflow: hidden;
    }

    .poster-container img,
    .poster-container svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .score-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(7, 8, 10, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(243, 235, 215, 0.15);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.55rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .score-badge.high { color: var(--accent-teal); border-color: rgba(0, 229, 188, 0.4); }
    .score-badge.mid { color: var(--accent-gold); border-color: rgba(229, 169, 60, 0.4); }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 0.85rem;
    }

    .film-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.55rem;
      line-height: 1.15;
      font-weight: 400;
      color: #fff;
    }

    .film-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .theater-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.82rem;
      border-top: 1px solid var(--card-border);
      padding-top: 0.75rem;
    }

    .theater-name {
      font-weight: 600;
      color: var(--text);
    }

    .theater-loc {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .format-tag {
      align-self: flex-start;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      background: rgba(255, 42, 75, 0.12);
      border: 1px solid rgba(255, 42, 75, 0.3);
      color: var(--accent-crimson);
      border-radius: 3px;
    }

    .showtimes-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--card-border);
    }

    .showtime-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: #090c10;
      padding: 0.35rem 0.55rem;
      border-radius: 3px;
      border: 1px solid rgba(243, 235, 215, 0.04);
    }

    .ticket-btn {
      display: block;
      text-align: center;
      background: #161b24;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-decoration: none;
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      margin-top: 0.75rem;
      transition: all 0.2s ease;
    }

    .ticket-btn:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <header>
      <div class="title-row">
        <h1>NYC Film Screenings</h1>
        <div class="stats-bar">
          <div>224 FILMS LOGGED // AVERAGE RATING: 3.79 ★</div>
        </div>
      </div>
    </header>

    <section class="controls-bar">
      <div class="filter-group">
        <button class="filter-btn active" data-min="0">ALL</button>
        <button class="filter-btn" data-min="60">60%</button>
        <button class="filter-btn" data-min="70">70%</button>
        <button class="filter-btn" data-min="80">80%</button>
      </div>

      <input 
        type="text" 
        id="search" 
        class="search-input" 
        placeholder="Filter by title, venue, or director..."
      />
    </section>

    <main id="grid" class="screenings-grid"></main>

  </div>

  <script>
    // -------------------------------------------------------------------------
    // Injected Data Container (Overwritten by update_screenings.py)
    // -------------------------------------------------------------------------
    const dataset = [];

    let activeMinScore = 0;
    let searchQuery = "";

    const gridElem = document.getElementById('grid');
    const searchInput = document.getElementById('search');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // Score filter button logic
    filterButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        filterButtons.forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        activeMinScore = parseInt(e.currentTarget.dataset.min, 10);
        render();
      });
    });

    // Search input handler
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    function getScoreClass(score) {
      if (score >= 80) return 'high';
      if (score >= 65) return 'mid';
      return '';
    }

    function render() {
      const filtered = dataset.filter(film => {
        const matchesScore = (film.matchScore || 0) >= activeMinScore;
        const matchesSearch = !searchQuery || 
          film.title.toLowerCase().includes(searchQuery) ||
          film.theater.toLowerCase().includes(searchQuery) ||
          (film.director && film.director.toLowerCase().includes(searchQuery)) ||
          (film.neighborhood && film.neighborhood.toLowerCase().includes(searchQuery));
        
        return matchesScore && matchesSearch;
      });

      if (filtered.length === 0) {
        gridElem.innerHTML = `
          <div class="empty-state">
            [ NO SCREENINGS MATCHING CURRENT FILTERS ]
          </div>
        `;
        return;
      }

      gridElem.innerHTML = filtered.map(film => {
        const posterMarkup = film.poster 
          ? `<img src="${film.poster}" alt="${film.title}" loading="lazy" />`
          : (film.svg || '<div style="width:100%;height:100%;background:#111;"></div>');

        const showtimesMarkup = (film.showtimes || []).map(st => 
          `<div class="showtime-chip">${st}</div>`
        ).join('');

        return `
          <article class="film-card">
            <div class="poster-container">
              ${posterMarkup}
              <div class="score-badge ${getScoreClass(film.matchScore)}">${film.matchScore}%</div>
            </div>

            <div class="card-body">
              <div>
                <h2 class="film-title">${film.title}</h2>
                <div class="film-meta">${film.director || 'Unknown'} // ${film.year || ''}</div>
              </div>

              <div class="format-tag">${film.format || 'DCP'}</div>

              <div class="theater-info">
                <span class="theater-name">${film.theater}</span>
                <span class="theater-loc">${film.neighborhood || ''}</span>
              </div>

              <div class="showtimes-list">
                ${showtimesMarkup}
              </div>

              ${film.ticketUrl ? `
                <a href="${film.ticketUrl}" target="_blank" rel="noopener noreferrer" class="ticket-btn">
                  TICKETS & INFO ↗
                </a>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    // Initial render
    render();
  </script>
</body>
</html>
